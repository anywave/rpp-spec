name: Drift report (advisory)

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # Rollout is report-only, including checker errors. No comments or remote writes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate advisory report
        id: drift
        shell: bash
        env:
          DRIFT_BASE: ${{ github.event.pull_request.base.sha }}
          DRIFT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python -m tools.drift check --base "$DRIFT_BASE" --head "$DRIFT_HEAD" --output-dir "$RUNNER_TEMP/drift"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 2 ] || [ ! -f "$RUNNER_TEMP/drift/drift-report.md" ]; then
            echo '## Drift tool error — review incomplete' >> "$GITHUB_STEP_SUMMARY"
            echo "Checker exit status: $status. This is not a clean review." >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/drift/drift-report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "Checker exit status: $status (advisory only)." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Check coordinator fixtures
        shell: bash
        run: |
          python -m pip install 'pytest>=7.0'
          python -m pytest tools/drift/tests/ -q -o addopts=
