name: Rust

on:
  push:
    paths:
      - "rust/**"
      - "tools/**"
      - "tests/test_vectors.json"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "rust/**"
      - "tools/**"
      - "tests/test_vectors.json"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: Rust (${{ matrix.os }} / 1.85.1)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12.14"
          - os: windows-latest
            python-version: "3.12.10"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned oracle Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.12.14 has Linux assets; 3.12.10 is the latest listed Windows 3.12 build.
          # Both use Unicode 15.0; the checker compares manifests and data without normalization.
          python-version: ${{ matrix.python-version }}
          architecture: "x64"

      - name: Verify committed oracle corpora
        working-directory: .
        env:
          PYTHONPATH: .
        run: python tools/rust_scaffold/check_corpora.py

      - name: Test corpus freshness guard
        working-directory: .
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tools/rust_scaffold/tests -p test_check_corpora.py -v

      - name: Check Rust lift boundaries
        working-directory: .
        run: python tools/rust_scaffold/check_lift.py

      - name: Test offline lift guard
        working-directory: .
        run: python -m unittest discover -s tools/rust_scaffold/tests -p test_check_lift.py -v

      - name: Install pinned Rust and check components
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy --target riscv32imc-unknown-none-elf

      - name: Fetch locked property-test dependencies (read only)
        working-directory: .
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo +1.85.1 fetch --manifest-path tools/fuzz_scaffold/Cargo.toml --locked

      - name: Run bounded properties on every host profile
        working-directory: .
        run: cargo +1.85.1 test --manifest-path tools/fuzz_scaffold/Cargo.toml --offline --locked

      - name: Format fuzz scaffold
        working-directory: .
        run: cargo +1.85.1 fmt --manifest-path tools/fuzz_scaffold/Cargo.toml --all --check

      - name: Lint fuzz scaffold offline
        working-directory: .
        run: cargo +1.85.1 clippy --manifest-path tools/fuzz_scaffold/Cargo.toml --all-targets --offline --locked -- -D warnings

      - name: Test bounded optional smoke guard
        working-directory: .
        run: python -m unittest tools.fuzz_scaffold.test_smoke -v

      - name: Compile fuzz target interfaces without claiming coverage
        if: runner.os == 'Linux'
        working-directory: .
        run: cargo +1.85.1 check --manifest-path tools/fuzz_scaffold/Cargo.toml --features fuzzing --bins --offline --locked

      - name: Optional preinstalled nightly fuzz smoke (60 seconds)
        working-directory: .
        run: python tools/fuzz_scaffold/smoke.py --output-dir "${{ runner.temp }}/rpp-fuzz-smoke"

      - name: Test billboard error precedence repairs
        working-directory: .
        run: python -m unittest tools.esp32_scaffold.test_billboard_errors -v

      - name: Test offline embedded compile guard
        working-directory: .
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tools/esp32_scaffold -p test_check_no_std.py -v

      - name: Check installed embedded bare libraries offline
        working-directory: .
        run: python tools/esp32_scaffold/check_no_std.py

      - name: Tool versions
        run: |
          rustc +1.85.1 --version
          cargo +1.85.1 --version

      - name: Prove copied Rust workspace
        working-directory: .
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          source = Path("rust").resolve()
          def ignore(directory, names):
              return set(names) & {"target", ".git"} if Path(directory) == source else set()
          with tempfile.TemporaryDirectory(prefix="rpp-rust-lift-") as temporary:
              copied = Path(temporary) / "rust"
              shutil.copytree(source, copied, ignore=ignore)
              env = dict(os.environ, CARGO_NET_OFFLINE="true", CARGO_TARGET_DIR=str(copied / "target"))
              for command in ("build", "test"):
                  subprocess.run(["cargo", "+1.85.1", command, "--workspace", "--locked"], cwd=copied, env=env, check=True, timeout=300)

      - name: Format
        run: cargo +1.85.1 fmt --all -- --check

      - name: Clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy with all features including simulation
        run: cargo +1.85.1 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo +1.85.1 test --workspace --locked

      - name: Host tests with explicit simulation feature
        run: cargo +1.85.1 test --workspace --features rpp-link/sim --locked

      - name: Host tests without default features
        run: cargo +1.85.1 test --workspace --no-default-features --locked

      - name: Host tests with alloc and no default features
        run: cargo +1.85.1 test --workspace --no-default-features --features alloc --locked

      - name: Live loopback UDP failover example
        run: cargo +1.85.1 run -p rpp-link-udp --example loopback_pair --locked

      - name: Cross-compile RPP core, control, link and fleet interfaces
        run: cargo +1.85.1 build --workspace --exclude rpp-link-udp --no-default-features --target riscv32imc-unknown-none-elf --locked

      - name: Cross-compile alloc-only policy models, adapters and fleet resolution
        run: cargo +1.85.1 build --workspace --exclude rpp-link-udp --no-default-features --features alloc --target riscv32imc-unknown-none-elf --locked
