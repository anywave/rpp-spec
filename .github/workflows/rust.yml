name: Rust

on:
  push:
    paths:
      - "rust/**"
      - "tools/**"
      - "tests/test_vectors.json"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "rust/**"
      - "tools/**"
      - "tests/test_vectors.json"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: Rust (${{ matrix.os }} / 1.85.1)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust and check components
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy --target riscv32imc-unknown-none-elf

      - name: Tool versions
        run: |
          rustc +1.85.1 --version
          cargo +1.85.1 --version

      - name: Format
        run: cargo +1.85.1 fmt --all -- --check

      - name: Clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo +1.85.1 test --workspace --locked

      - name: Host tests without default features
        run: cargo +1.85.1 test --workspace --no-default-features --locked

      - name: Cross-compile allocation-free codecs
        run: cargo +1.85.1 build --workspace --no-default-features --target riscv32imc-unknown-none-elf --locked

      - name: Cross-compile alloc-only policy models
        run: cargo +1.85.1 build --workspace --no-default-features --features alloc --target riscv32imc-unknown-none-elf --locked
