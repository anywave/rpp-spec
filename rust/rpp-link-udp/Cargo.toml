[package]
name = "rpp-link-udp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Synchronous loopback/tailnet UDP adapter with measured round-trip readings"

[features]
default = ["fleet-demo"]
fleet-demo = ["dep:rpp-core", "dep:rpp-fleet"]

[dependencies]
rpp-link = { path = "../rpp-link", version = "=0.1.0", default-features = false }
rpp-control = { path = "../rpp-control", version = "=0.1.0", default-features = false }
rpp-core = { path = "../rpp-core", version = "=0.1.0", default-features = false, features = ["alloc"], optional = true }
rpp-fleet = { path = "../rpp-fleet", version = "=0.1.0", default-features = false, features = ["alloc"], optional = true }

