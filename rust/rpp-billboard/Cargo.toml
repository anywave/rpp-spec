[package]
name = "rpp-billboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Borrowed experimental billboard envelope with caller verification"

[features]
default = ["std"]
std = ["alloc", "rpp-core/std"]
alloc = ["dep:rpp-core", "rpp-core/alloc"]

[dependencies]
rpp-core = { path = "../rpp-core", version = "=0.1.0", optional = true, default-features = false }
