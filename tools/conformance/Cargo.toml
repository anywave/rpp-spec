[package]
name = "rpp-conformance"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
publish = false
description = "Offline byte conformance against pinned source implementations"

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
lw-jobcard = { path = "../.conformance-sources/latticeworks/crates/lw-jobcard" }
lw-registry = { path = "../.conformance-sources/latticeworks/crates/lw-registry" }
lw-pool = { path = "../.conformance-sources/latticeworks/crates/lw-pool" }
rpp-core = { path = "../../rust/rpp-core" }
